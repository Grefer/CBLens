[project]
name = "cblens"
version = "1.0.0"
description = "CBLens: A 股可转债定价与机会筛选工作台，支持 Crank-Nicolson PDE、公告事件、Wind/akshare 和 GUI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["convertible-bond", "pricing", "pde", "wind", "akshare", "quant"]
dependencies = [
    "customtkinter>=5.2.2",
    "matplotlib>=3.10",
    "numpy>=2.0",
    "scipy>=1.14",
    "pillow>=10.0",
    "akshare>=1.13",
    "requests>=2.28",
    "pdfplumber>=0.9",
]

[project.urls]
Homepage = "https://github.com/Grefer/CBLens"
Repository = "https://github.com/Grefer/CBLens"
Documentation = "https://github.com/Grefer/CBLens/blob/main/docs/USAGE.md"
Issues = "https://github.com/Grefer/CBLens/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
desktop = ["pyinstaller>=6.10", "pillow>=10.0"]

[project.scripts]
cb-gui = "convertible_bond.gui.app:main"
cb-backfill-delisted-cbs = "convertible_bond.cli.backfill_delisted_cbs:main"
cb-backfill-down-reset-patches = "convertible_bond.cli.backfill_down_reset_patches:main"
cb-calibrate-down-reset = "convertible_bond.cli.calibrate_down_reset:main"
cb-rebuild-terms-patches = "convertible_bond.cli.rebuild_terms_patches:main"
cb-repair-balance-patches = "convertible_bond.cli.repair_balance_patches:main"
cb-repair-events = "convertible_bond.cli.repair_events:main"
cb-repair-putback-windows = "convertible_bond.cli.repair_putback_windows:main"
cb-repair-rating-patches = "convertible_bond.cli.repair_rating_patches:main"
cb-data-doctor = "convertible_bond.cli.data_doctor:main"
cb-sync-ratings = "convertible_bond.cli.sync_ratings:main"
cb-screen-pool = "convertible_bond.cli.screen_pool:main"
cb-valuation = "convertible_bond.cli.market_valuation:main"
cb-strategy-backtest = "convertible_bond.cli.strategy_backtest:main"
cb-sync-admission-status = "convertible_bond.cli.sync_admission_status:main"
cb-sync-events = "convertible_bond.cli.sync_events:main"
cb-sync-new-issues = "convertible_bond.cli.sync_new_issues:main"
cb-sync-tradable = "convertible_bond.cli.sync_tradable:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 无头模式是**默认**, 不是需要记得加的开关。macOS 的 Tk 不需要 X11, 所以
# `ttk.Style()` / `tkinter.Tk()` 在本机悄悄成功、在 runner 上抛 TclError ——
# 曾靠 AGENTS 里一句"记得跑 `pytest -p tests.headless`"防守, 而人不会记得
# (实测连红三次推送都是同一条测试)。放进 addopts 之后本机与 CI 同口径。
# CI 上它是无操作 (那里本来就没有显示器), 所以两边的 skip 数不变。
# 逃生口是 `CBLENS_REAL_TK=1 pytest`, **不是** `-p no:tests.headless` —— 插件在
# import 时就打了补丁, 而 addopts 的 -p 先于命令行的 no: 生效, 后者什么也关不掉
# (实测两种跑法 skip 数完全相同)。
addopts = ["-p", "tests.headless"]

[tool.ruff]
# 起步只选高价值正确性规则: E9 (语法/IO 错误) + F (pyflakes: 未定义名/未用导入/重复定义)。
# F821 (未定义名) 是 GUI 代码静态防线 — 运行期 NameError 在测试环境无法触达, 靠它兜底。
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F"]
# F841 (未用局部变量) 噪音大且无运行期风险, 暂不启用
ignore = ["F841"]

[tool.ruff.lint.per-file-ignores]
# 历史 star import, 重构另行处理; F405 为 star import 的连带误报
"convertible_bond/gui/tabs/batch.py" = ["F403", "F405"]
"convertible_bond/gui/tabs/batch_watchlist.py" = ["F403", "F405"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["convertible_bond*"]
